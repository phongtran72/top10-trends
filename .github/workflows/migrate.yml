name: migrate

on:
  push:
    branches: [main]
    paths:
      - "db/migrations/**"
  workflow_dispatch:

permissions:
  contents: read

# npm ci runs onnxruntime-node's install script, which on Linux downloads its
# CUDA binaries from api.nuget.org. Everything here embeds on the CPU (whose
# binaries ship in the package), and that download timed out in four hourly
# runs in November, failing them (task 4.10).
env:
  ONNXRUNTIME_NODE_INSTALL: skip

concurrency:
  group: migrate
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
        env:
          SESSION_DATABASE_URL: ${{ secrets.SESSION_DATABASE_URL }}
