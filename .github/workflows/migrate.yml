name: migrate

on:
  push:
    branches: [main]
    paths:
      - "db/migrations/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: migrate
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
        env:
          SESSION_DATABASE_URL: ${{ secrets.SESSION_DATABASE_URL }}
