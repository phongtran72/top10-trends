name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# npm ci runs onnxruntime-node's install script, which on Linux downloads its
# CUDA binaries from api.nuget.org. Everything here embeds on the CPU (whose
# binaries ship in the package), and that download timed out in four hourly
# runs in November, failing them (task 4.10).
env:
  ONNXRUNTIME_NODE_INSTALL: skip

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            worker/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # No secrets: the build must never query the database.
      - run: npm run build
      - name: Typecheck and test the Worker
        working-directory: worker
        run: |
          npm ci
          npm run typecheck
          npm test
